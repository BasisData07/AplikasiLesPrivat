name: PRIVATE_AJA
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  # Batasan SDK diperbaiki: Pastikan Dart 3.0+
  sdk: ">=3.0.0 <4.0.0" 

dependencies:
  flutter:
    sdk: flutter
    
  # 🔥 PLATFORM & UTILITY PACKAGES (Diperbarui ke versi terbaru stabil)
  device_info_plus: ^10.1.0      # Menghindari konflik mendalam dengan versi web Firebase
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.18.1
  url_launcher: ^6.2.5
  font_awesome_flutter: ^10.7.0
  flutter_rating_bar: ^4.0.1
  webview_flutter: ^4.7.0 
  equatable: ^2.0.5
  image_picker: ^1.1.0
  timeago: ^3.6.1
  #http: ^1.2.1
  #web_socket_channel: ^2.4.2
  
  # 🔥 FIREBASE PACKAGES (Diperbarui ke versi V14/V4 terbaru)
  # Ini adalah sumber konflik utama yang menyebabkan error JavaScriptObject
  firebase_core: ^2.24.2 
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.15
  #firebase_core: ^latest_version
  #firebase_auth: ^latest_version
  #firebase_storage: ^latest_version
  #firebase_database: ^latest_version
  
  # Kunci/Library lainnya
  cupertino_icons: ^1.0.8
  mocktail: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Versi lints disesuaikan

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true
  
  assets:
    - assets/panda.png
    - assets/guru1.jpg
    - assets/guru2.jpg
    - assets/guru3.jpg
    - assets/html/help_center.html
    - assets/private.png
    - assets/nu.png
    - assets/rahma.jpg
    - assets/wafiq.jpg
    - assets/dicky.jpg
    - assets/qolbun.jpg
    - assets/bowo.png
